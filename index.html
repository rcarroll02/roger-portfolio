<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roger Carroll</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/6aa67f665e.js" crossorigin="anonymous"></script>
</head>

<body>
  <section id="about me">
    <nav>
      <div class="personal__logo">Roger Carroll</div>
      <ul class="nav__link--list">
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Languages</a>
        </li>
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Project</a>
        </li>
        <li>
          <a href="" class="
          nav__link--anchor
          nav__link--anchor-primary
          ">Contact</a>
        </li>
      </ul>
    </nav>
    <div class="flex flex-1">
      <div class=".about-me__info row">
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="profile-picture--mask.jpeg" class="about-me__picture" alt="picture of me!">
          </figure>
          <h1 class="about-me__info--title">
            Hey! Im <span class="text--purple">Roger Carroll</span>
          </h1>
          <p class="about-me__info--para">
            "<strong class="text-purple">about me</strong> info text"
          </p>
          <div class="about-me__links">
            <a href=""" class="about-me__link">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="" class="about-me__link">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="" class="about-me__link">
              <i class="fas fa-envelope"></i>
            </a>
            <a href="" class="about-me__link">
              <i class="fas fa-file-pdf"></i>
            </a>
          </div>
        </div>
        <figure class="about-me__img--container">
          <img src="undraw_in-progress_2mox.svg" class="about-me__img"alt="illustration of me working my way up">
        </figure>
      </div>
    </div>
  </section>
  <section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">This is my technology stack</h1>
        <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="css badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="HTML5_Badge.svg" class="language__img" alt="html5 badge">
            </figure>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
